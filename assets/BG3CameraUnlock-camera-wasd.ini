# BG3 Camera Unlock — configuration  (flavor: Camera + WASD)
#
# Plain key=value. Lines starting with # or ; are comments; [Section]
# headers are decorative. The game must be fully restarted after editing.
#
# Every value is validated on load. An out-of-range, malformed, or
# non-finite value is logged in mod.log and the safe default is kept, so a
# typo can never put the camera into a bad state.

# Schema version of this file. Leave it alone unless a release note tells you
# otherwise; it exists so a future version can migrate old settings.
ConfigVersion=1

[Camera]
# Vertical look limits in degrees. Minimum must be below maximum.
# Valid range: -89 to 88 / -88 to 89.
PitchMinimumDegrees=-45.0
PitchMaximumDegrees=85.0

# --- Per-device look sensitivity --------------------------------------------
#
# Horizontal (yaw) and vertical (pitch) look speed, set separately for each
# input device so tuning one never moves another. With every key below left
# at its default the feel is exactly the tested one:
#   gamepad 2.0 / 1.0   trackpad 1.0 / 1.0   mouse 1.0 / 1.0
#
# A canonical key here always wins over its legacy alias, whatever the line
# order. The legacy keys are still read:
#   HorizontalSensitivity     -> GamepadHorizontalSensitivity
#   VerticalSensitivity       -> GamepadVerticalSensitivity, and
#                                TrackpadVerticalSensitivity if that
#                                canonical key is absent
#   PointerRotateSensitivity  -> TrackpadHorizontalSensitivity, normalised:
#                                the proven trackpad-yaw base is 3.0, so the
#                                old 3.0 maps to the new 1.0

# Gamepad. 2.0 / 1.0 are the tuned, confirmed-good values — deliberately not
# aligned with the other devices. Valid range: 0.10 to 4.00 / 0.10 to 3.00.
GamepadHorizontalSensitivity=2.0
GamepadVerticalSensitivity=1.0

# Trackpad. 1.0 reproduces the current two-finger swipe (yaw) and the current
# precise vertical swipe (pitch). Valid range: 0.10 to 8.00 / 0.10 to 3.00.
TrackpadHorizontalSensitivity=1.0
TrackpadVerticalSensitivity=1.0

# Mouse. Horizontal scales BG3's native middle-button-drag yaw; vertical
# drives look from a middle-button drag up and down. Valid range: 0.10 to
# 8.00 / 0.10 to 3.00.
MouseHorizontalSensitivity=1.0
MouseVerticalSensitivity=1.0

# Legacy single-axis keys. Still read as aliases (see the block above); a
# canonical per-device key overrides them regardless of order.
HorizontalSensitivity=2.0
VerticalSensitivity=1.0
PointerRotateSensitivity=3.0

# --- Zoom -----------------------------------------------------------------

# Top speed of L3 + right-stick zoom, at full stick deflection. Changes
# speed, not the distance limits below. Valid range: 0.05 to 3.00.
ZoomSensitivity=0.6

# Shape of the zoom stick response. 1.0 is a straight line; higher values
# give finer control near the stick centre, where you pick a distance, while
# full deflection stays fast. Valid range: 1.00 to 4.00.
ZoomResponseCurve=2.0

# Zoom rate the instant the stick leaves the deadzone. Ramping from zero
# leaves a band that moves too slowly to see, which reads as a deadzone.
# Valid range: 0.00 to 0.50.
ZoomMinimumResponse=0.12

# How close the camera may come to the character, in world units. Lower gets
# you nearer the face. 0 keeps the game's own limit.
# Valid range: 0, or 0.05 to 50.00.
MinimumZoomDistance=0.5

# How far the camera may pull back. 0 keeps the game's own limit.
# Valid range: 0, or 1.00 to 500.00.
MaximumZoomDistance=0

# Ignore small right-stick movement. Valid range: 0.00 to 0.80.
StickDeadzone=0.15

# --- Keyboard movement (Camera + WASD flavor) ---------------------------

# Lets the game's existing character-movement task consume the bound W, A,
# S and D actions while keyboard UI mode is active. The controller path is
# not affected. Set false to leave BG3's mode guard untouched and play with
# camera control only.
KeyboardMovement=true

[Logging]
# Startup and pattern verification are always logged — those few lines are
# what a bug report needs. This adds per-event camera state changes on top,
# and is the setting a support request will ask you to turn on.
VerboseLogging=false

[Collision]
# Best-effort wall and floor protection at angles the base game never uses.
ObstacleCollision=true
FloorProtection=true

# Advanced: extra clearance kept from a wall / floor, in world units.
CollisionSafetyMargin=0.20
FloorSafetyOffset=1.00

[Advanced]
# These change how pointer (trackpad / mouse) rotation is delivered. The
# defaults are the tested path; change them only to work around a specific
# problem, and expect to test in-game.

# Hand a trackpad / mouse swipe to BG3's own pointer rotation channel (the
# one the controller uses), instead of writing the camera heading directly.
# true is the tested behaviour. Valid: true or false.
PointerRotationNative=true

# While a swipe lasts, hold the camera's per-frame follow correction still so
# the swipe is not partly undone in the same frame. Valid: true or false.
PointerRotationHoldsHeading=true

# How long unspent trackpad travel takes to become rotation, in
# milliseconds. Native mode keeps a 30 ms stability floor. Valid range: 0 to
# 250.
PointerRotateSmoothingMs=30

# How long after the last swipe the follow correction stays held, in
# seconds. The default holds it for a whole swiping session so the camera
# stays where you put it; 0 holds it only during a swipe. Valid range: 0 to
# 3600.
PointerRotationFollowHoldSeconds=3600

# Treat the zoom axis as active for any deflection past StickDeadzone. The
# game otherwise decides for itself when the axis counts as moving, and that
# decision is what leaves a band where zoom does nothing. Valid: true/false.
ZoomForceActive=true

# Trackpad / mouse button that acts like L3: held, the vertical axis zooms;
# released, it pitches. 0 disables it. There is no safe default — the id of a
# mouse button is assigned by BG3's own input map. Turn VerboseLogging on,
# press the button, and read the id from the "seen pressed" line in mod.log.
PointerZoomModifierEvent=0

# How PointerZoomModifierEvent is read. false: the button is held (needs the
# game to report a release). true: each press flips pitch <-> zoom, for a
# button the game only reports a press for. Valid: true or false.
PointerZoomModifierToggle=false

# Physical mouse button polled for a real hold: 0 off, 1 left, 2 right, 3
# middle. Reads the OS button state directly, because BG3 reports a mouse
# button as a press and release back to back even while it is held.
PointerZoomHoldButton=0

# Input device whose zoom action means zoom rather than pitch. -1 disables
# it (0 is a real device id, so it cannot mean "off"). Ids are logged with
# VerboseLogging on.
ZoomDeviceId=-1

# Zoom step from one press of the zoom device. A key has no travel to
# modulate, so this is the only thing that sets how coarse it feels.
# Valid range: 0.01 to 1.00.
ZoomDeviceSensitivity=0.25
